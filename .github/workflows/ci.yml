name: CI

on:
  push:
    branches: [main, turso]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Бизнес-логика на настоящей libSQL (файл в памяти): секреты и облачная база не нужны.
      - run: npm run test:db
      - run: npm run scan:secrets
      # Сборка без секретов: без адреса базы приложение показывает инструкцию по настройке.
      - run: npm run build
      - run: npm run test:static

  # Полный e2e на временной файловой базе SQLite: ни секретов, ни облачных сервисов не требуется.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:e2e.db
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report
